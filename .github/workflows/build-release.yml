name: Build release binaries

on:
  push:
    branches:
      - main
    # Publish a release only when the binary can change.
    paths:
      - main.go
      - go.mod
      - go.sum
      - internal/**
      - scripts/**
      - .github/workflows/build-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build release binaries
        run: sh scripts/build-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release/version)
          if gh release view "$version" > /dev/null 2>&1; then
            echo "release $version already exists"
            exit 0
          fi
          gh release create "$version" release/*.gz release/version \
            --target "$GITHUB_SHA" --title "parity $version" --notes "Built from $GITHUB_SHA." --latest
